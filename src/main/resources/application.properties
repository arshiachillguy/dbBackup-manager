spring.application.name=backup-manager

# spring.datasource.username=backup_manager_user
# spring.datasource.password=1953

spring.jpa.hibernate.ddl-auto=update

# SQLite - internal application database
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.org.hibernate= WARN
logging.level.org.springframework=INFO
debug=false

backup-manager.data-dir=${BACKUP_MANAGER_DATA_DIR:${user.home}/.local/share/backup-manager}
spring.datasource.url=jdbc:sqlite:${backup-manager.data-dir}/backup-manager.db